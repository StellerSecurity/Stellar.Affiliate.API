# PHP as Linux Web App on Azure
# Build, package and deploy your PHP project to Azure Linux Web App.
# Add steps that run tests and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/php

trigger:
- main

parameters:
- name: sendAffiliatePayoutCampaign
  displayName: 'Send payout-details campaign to eligible affiliates'
  type: boolean
  default: false
- name: testAffiliatePayoutSlack
  displayName: 'Send non-sensitive affiliate payout Slack test'
  type: boolean
  default: false

schedules:
- cron: '5 1 * * *'
  displayName: 'Daily production affiliate payouts'
  branches:
    include:
    - main
  always: true

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: 'def0885f-b1b9-4ca2-ae7f-6804eab60b56'

  # Web app name
  webAppName: 'StellarAffiliateApiProd'

  # Resource group containing the web app
  resourceGroupName: 'switzerland_group'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

  # Environment name
  environmentName: 'StellarAffiliateApiProd'

  # Root folder under which your composer.json file is available.
  rootFolder: $(System.DefaultWorkingDirectory)

stages:
- stage: Build
  displayName: Build stage
  variables:
    phpVersion: '8.2'
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        sudo update-alternatives --set php /usr/bin/php$(phpVersion)
        sudo update-alternatives --set phar /usr/bin/phar$(phpVersion)
        sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(phpVersion)
        sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(phpVersion)
        sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(phpVersion)
        php -version
      workingDirectory: $(rootFolder)
      displayName: 'Use PHP version $(phpVersion)'

    - script: composer install --no-interaction --prefer-dist --optimize-autoloader
      workingDirectory: $(rootFolder)
      displayName: 'Composer install'

    - task: AzureCLI@2
      displayName: 'Migrate and validate automatic payouts'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(rootFolder)
        inlineScript: |
          set -euo pipefail
          umask 077
          settings_file="$(Agent.TempDirectory)/stellar-affiliate-appsettings.json"
          trap 'rm -f "$settings_file"' EXIT
          az webapp config appsettings list \
            --resource-group $(resourceGroupName) \
            --name $(webAppName) \
            --output json > "$settings_file"
          php scripts/run-artisan-with-app-settings.php "$settings_file" migrate --force --no-interaction
          php scripts/run-artisan-with-app-settings.php "$settings_file" affiliate:process-payouts --provider-check
          php scripts/run-artisan-with-app-settings.php "$settings_file" affiliate:process-payouts --preview

    - task: AzureCLI@2
      displayName: 'Process scheduled affiliate payouts'
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Schedule'))
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(rootFolder)
        inlineScript: |
          set -euo pipefail
          umask 077
          settings_file="$(Agent.TempDirectory)/stellar-affiliate-appsettings.json"
          trap 'rm -f "$settings_file"' EXIT
          az webapp config appsettings list \
            --resource-group $(resourceGroupName) \
            --name $(webAppName) \
            --output json > "$settings_file"
          php scripts/run-artisan-with-app-settings.php "$settings_file" affiliate:process-payouts --allow-attention --no-interaction

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(rootFolder)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: 'Upload package'
      artifact: drop

- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: Build
  condition: and(succeeded(), ne(variables['Build.Reason'], 'Schedule'))
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : StellarAffiliateApiProd'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              appType: webAppLinux
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip

          - task: AzureAppServiceSettings@1
            displayName: 'Configure scheduler and health check'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              resourceGroupName: $(resourceGroupName)
              appSettings: |
                [
                  {
                    "name": "AFFILIATE_AUTOMATIC_PAYOUTS_ENABLED",
                    "value": "true",
                    "slotSetting": false
                  },
                  {
                    "name": "WEBSITE_SKIP_RUNNING_KUDUAGENT",
                    "value": "false",
                    "slotSetting": false
                  },
                  {
                    "name": "WEBSITES_ENABLE_APP_SERVICE_STORAGE",
                    "value": "true",
                    "slotSetting": false
                  }
                ]
              generalSettings: |
                [
                  {
                    "alwaysOn": true,
                    "healthCheckPath": "/up"
                  }
                ]

          - task: AzureCLI@2
            displayName: 'Configure existing Stellar Notification API client'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                umask 077
                source_settings="$(Agent.TempDirectory)/stellar-notification-source-settings.json"
                target_settings="$(Agent.TempDirectory)/stellar-affiliate-notification-settings.json"
                trap 'rm -f "$source_settings" "$target_settings"' EXIT

                az webapp config appsettings list \
                  --resource-group StellarSwitzerlandSubscription \
                  --name StellarCommerceAPIProd \
                  --output json > "$source_settings"

                jq '[.[] | select(
                    .name == "STELLAR_NOTIFICATIONS_BASE_URL"
                    or .name == "STELLAR_NOTIFICATIONS_BASIC_USERNAME"
                    or .name == "STELLAR_NOTIFICATIONS_BASIC_PASSWORD"
                  ) | {name: .name, value: .value, slotSetting: false}]' \
                  "$source_settings" > "$target_settings"

                test "$(jq 'length' "$target_settings")" -eq 3
                test "$(jq '[.[] | select((.value // "") == "")] | length' "$target_settings")" -eq 0

                az webapp config appsettings set \
                  --resource-group $(resourceGroupName) \
                  --name $(webAppName) \
                  --settings "@$target_settings" \
                  --output none

          - task: AzureAppServiceSettings@1
            displayName: 'Configure affiliate payout Slack channel'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              resourceGroupName: $(resourceGroupName)
              appSettings: |
                [
                  {
                    "name": "AFFILIATE_PAYOUT_SLACK_CHANNEL_ID",
                    "value": "C0C6XNYD3H6",
                    "slotSetting": false
                  },
                  {
                    "name": "AFFILIATE_PAYOUT_ADMIN_URL",
                    "value": "https://stellarafi.com/affiliate/admin/payouts",
                    "slotSetting": false
                  },
                  {
                    "name": "SLACK_BOT_USER_OAUTH_TOKEN",
                    "value": "$(SLACK_BOT_USER_OAUTH_TOKEN)",
                    "slotSetting": true
                  }
                ]

          - task: AzureCLI@2
            displayName: 'Test affiliate payout Slack alert'
            condition: and(succeeded(), ${{ eq(parameters.testAffiliatePayoutSlack, true) }})
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Pipeline.Workspace)/drop
              inlineScript: |
                set -euo pipefail
                umask 077
                settings_file="$(Agent.TempDirectory)/stellar-affiliate-appsettings.json"
                work_dir="$(Agent.TempDirectory)/stellar-affiliate-slack-test"
                package_path="$(find "$(Pipeline.Workspace)/drop" -maxdepth 1 -name '*.zip' -print -quit)"
                test -n "$package_path"
                rm -rf "$work_dir"
                mkdir -p "$work_dir"
                unzip -q "$package_path" -d "$work_dir"
                trap 'rm -rf "$settings_file" "$work_dir"' EXIT
                az webapp config appsettings list \
                  --resource-group $(resourceGroupName) \
                  --name $(webAppName) \
                  --output json > "$settings_file"
                php "$work_dir/scripts/run-artisan-with-app-settings.php" "$settings_file" affiliate:test-payout-slack --send --no-interaction

          - task: AzureCLI@2
            displayName: 'Send approved payout-details test email'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/stellar/affiliate-payout-details-email'), ${{ eq(parameters.sendAffiliatePayoutCampaign, false) }})
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Pipeline.Workspace)/drop
              inlineScript: |
                set -euo pipefail
                umask 077
                settings_file="$(Agent.TempDirectory)/stellar-affiliate-appsettings.json"
                work_dir="$(Agent.TempDirectory)/stellar-affiliate-test-mail"
                package_path="$(find "$(Pipeline.Workspace)/drop" -maxdepth 1 -name '*.zip' -print -quit)"
                test -n "$package_path"
                rm -rf "$work_dir"
                mkdir -p "$work_dir"
                unzip -q "$package_path" -d "$work_dir"
                trap 'rm -rf "$settings_file" "$work_dir"' EXIT
                az webapp config appsettings list \
                  --resource-group $(resourceGroupName) \
                  --name $(webAppName) \
                  --output json > "$settings_file"
                php "$work_dir/scripts/run-artisan-with-app-settings.php" "$settings_file" affiliate:email-payout-details --send --test=blerim@cazimi.dk --no-interaction

          - task: AzureCLI@2
            displayName: 'Send approved payout-details campaign'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/stellar/affiliate-payout-details-email'), ${{ eq(parameters.sendAffiliatePayoutCampaign, true) }})
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Pipeline.Workspace)/drop
              inlineScript: |
                set -euo pipefail
                umask 077
                settings_file="$(Agent.TempDirectory)/stellar-affiliate-appsettings.json"
                work_dir="$(Agent.TempDirectory)/stellar-affiliate-campaign"
                package_path="$(find "$(Pipeline.Workspace)/drop" -maxdepth 1 -name '*.zip' -print -quit)"
                test -n "$package_path"
                rm -rf "$work_dir"
                mkdir -p "$work_dir"
                unzip -q "$package_path" -d "$work_dir"
                trap 'rm -rf "$settings_file" "$work_dir"' EXIT
                az webapp config appsettings list \
                  --resource-group $(resourceGroupName) \
                  --name $(webAppName) \
                  --output json > "$settings_file"
                php "$work_dir/scripts/run-artisan-with-app-settings.php" "$settings_file" affiliate:email-payout-details --preview --no-interaction
                php "$work_dir/scripts/run-artisan-with-app-settings.php" "$settings_file" affiliate:email-payout-details --send --no-interaction
